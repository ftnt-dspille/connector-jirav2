name: release

# Tag `v1.0.0` builds the bundle for info.json version 1.0.0 and attaches it to
# a GitHub release. The tag is the trigger, but info.json stays the source of
# truth for the version: the check below refuses a tag that disagrees with it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tag must match info.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          info=$(python3 -c "import json;print(json.load(open('info.json'))['version'])")
          if [ "$tag" != "$info" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match info.json version $info"
            exit 1
          fi
          echo "version=$info" >> "$GITHUB_ENV"

      - name: Tests (offline)
        run: |
          pip install -r tests/requirements.txt
          python3 -m pytest tests -q

      - name: Generated files are current
        run: |
          python3 scripts/gen_docs.py --check
          python3 scripts/gen_info.py
          git diff --exit-code info.json

      - name: Build bundle
        run: ./scripts/package.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jirav2-${{ env.version }}.tgz
          body_path: release_notes.md
